{% set name = "itemadapter" %}
{% set version = "0.14.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ba7c46f434cc127dfdc55b077e724bcf88721e0bbfd472fe6cf8dde8bcd2008b

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
  run_constrained:
    - attrs >=22.1.0
    - pydantic >=2.7
    - scrapy >=2.7

test:
  source_files:
    - tests
  imports:
    - itemadapter
    - itemadapter._imports
    - itemadapter._json_schema
    - itemadapter.adapter
    - itemadapter.utils
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest tests -v

about:
  home: https://github.com/scrapy/itemadapter
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Common interface for different data containers
  description: |
    The ItemAdapter class is a wrapper for data container objects, providing a
    common interface to handle objects of different types in an uniform manner,
    regardless of their underlying implementation.
  dev_url: https://github.com/scrapy/itemadapter
  doc_url: https://github.com/scrapy/itemadapter/blob/master/README.md

extra:
  recipe-maintainers:
    - Gallaecio
    - wRAR
    - dangra
    - rmax
